name: Build Windows Update Suite
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "tools/UniverseUpdater/**"
      - "tools/AdminSystemsTerminal/**"
      - "package.json"
      - "version.json"
      - "update-manifest.json"
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build updater
        run: dotnet publish tools/UniverseUpdater/UniverseUpdater.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true
      - name: Build admin terminal
        run: dotnet publish tools/AdminSystemsTerminal/AdminSystemsTerminal.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true
      - name: Package update suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "tools/UniverseUpdater/bin/Release/net8.0-windows/win-x64/publish/UniverseUpdater.exe" "release/UniverseUpdater.exe"
          Copy-Item "tools/AdminSystemsTerminal/bin/Release/net8.0-windows/win-x64/publish/UniverseAdminTerminal.exe" "release/UniverseAdminTerminal.exe"
          Copy-Item "version.json" "release/version.json"
          Copy-Item "update-manifest.json" "release/update-manifest.json"
          Compress-Archive -Path release/* -DestinationPath "Universe-Admin-Update-Suite.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Universe-Admin-Update-Suite
          path: Universe-Admin-Update-Suite.zip
