name: Build Windows Admin and Update Suite

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "tools/UniverseUpdater/**"
      - "tools/AdminSystemsTerminal/**"
      - "package.json"
      - "version.json"
      - "update-manifest.json"
      - ".github/workflows/build-update-suite.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Admin Systems GUI EXE
        run: dotnet publish tools/AdminSystemsTerminal/AdminSystemsTerminal.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Build Universe Updater EXE
        run: dotnet publish tools/UniverseUpdater/UniverseUpdater.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Validate Windows executables
        shell: pwsh
        run: |
          $admin = Get-Item "tools/AdminSystemsTerminal/bin/Release/net8.0-windows/win-x64/publish/UniverseAdminTerminal.exe"
          $updater = Get-Item "tools/UniverseUpdater/bin/Release/net8.0-windows/win-x64/publish/UniverseUpdater.exe"
          foreach ($exe in @($admin, $updater)) {
            if ($exe.Length -lt 1000000) { throw "$($exe.Name) is unexpectedly small: $($exe.Length) bytes" }
            $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "$($exe.Name) is not a valid PE/MZ executable" }
            Write-Host "$($exe.Name): $($exe.Length) bytes"
          }

      - name: Smoke test Windows executables
        shell: pwsh
        run: |
          $paths = @(
            "tools/AdminSystemsTerminal/bin/Release/net8.0-windows/win-x64/publish/UniverseAdminTerminal.exe",
            "tools/UniverseUpdater/bin/Release/net8.0-windows/win-x64/publish/UniverseUpdater.exe"
          )
          foreach ($path in $paths) {
            $p = Start-Process -FilePath (Resolve-Path $path) -PassThru
            Start-Sleep -Seconds 5
            if ($p.HasExited -and $p.ExitCode -ne 0) {
              throw "$path exited during smoke test with code $($p.ExitCode)"
            }
            if (-not $p.HasExited) {
              Stop-Process -Id $p.Id -Force
              Write-Host "$path started successfully and remained responsive."
            } else {
              Write-Host "$path exited cleanly during smoke test."
            }
          }

      - name: Prepare release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/update-suite | Out-Null
          Copy-Item "tools/AdminSystemsTerminal/bin/Release/net8.0-windows/win-x64/publish/UniverseAdminTerminal.exe" "release/update-suite/UniverseAdminTerminal.exe" -Force
          Copy-Item "tools/UniverseUpdater/bin/Release/net8.0-windows/win-x64/publish/UniverseUpdater.exe" "release/update-suite/UniverseUpdater.exe" -Force
          if (Test-Path "version.json") { Copy-Item "version.json" "release/update-suite/version.json" -Force }
          if (Test-Path "update-manifest.json") { Copy-Item "update-manifest.json" "release/update-suite/update-manifest.json" -Force }
          Compress-Archive -Path release/update-suite/* -DestinationPath "Universe-Admin-Update-Suite-win-x64.zip" -Force

      - name: Upload Admin and Update Suite
        uses: actions/upload-artifact@v4
        with:
          name: Universe-Admin-Update-Suite-win-x64
          path: Universe-Admin-Update-Suite-win-x64.zip
