name: Build Windows Admin and Update Suite

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "tools/UniverseUpdater/**"
      - "tools/AdminSystemsTerminal/**"
      - "package.json"
      - "version.json"
      - "update-manifest.json"
      - ".github/workflows/build-update-suite.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Admin Systems GUI EXE
        run: dotnet publish tools/AdminSystemsTerminal/AdminSystemsTerminal.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Build Universe Updater EXE
        run: dotnet publish tools/UniverseUpdater/UniverseUpdater.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Validate Windows executables
        shell: pwsh
        run: |
          $admin = Get-Item "tools/AdminSystemsTerminal/bin/Release/net8.0-windows/win-x64/publish/UniverseAdminTerminal.exe"
          $updater = Get-Item "tools/UniverseUpdater/bin/Release/net8.0-windows/win-x64/publish/UniverseUpdater.exe"
          if ($admin.Length -lt 1000000) { throw "UniverseAdminTerminal.exe is unexpectedly small: $($admin.Length) bytes" }
          if ($updater.Length -lt 1000000) { throw "UniverseUpdater.exe is unexpectedly small: $($updater.Length) bytes" }
          Write-Host "UniverseAdminTerminal.exe: $($admin.Length) bytes"
          Write-Host "UniverseUpdater.exe: $($updater.Length) bytes"

      - name: Prepare release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/update-suite | Out-Null
          Copy-Item "tools/AdminSystemsTerminal/bin/Release/net8.0-windows/win-x64/publish/UniverseAdminTerminal.exe" "UniverseAdminTerminal.exe" -Force
          Copy-Item "tools/UniverseUpdater/bin/Release/net8.0-windows/win-x64/publish/UniverseUpdater.exe" "UniverseUpdater.exe" -Force
          Copy-Item "UniverseAdminTerminal.exe" "release/update-suite/UniverseAdminTerminal.exe"
          Copy-Item "UniverseUpdater.exe" "release/update-suite/UniverseUpdater.exe"
          if (Test-Path "version.json") { Copy-Item "version.json" "release/update-suite/version.json" }
          if (Test-Path "update-manifest.json") { Copy-Item "update-manifest.json" "release/update-suite/update-manifest.json" }
          Compress-Archive -Path release/update-suite/* -DestinationPath "Universe-Admin-Update-Suite-win-x64.zip" -Force

      - name: Upload Admin and Update Suite
        uses: actions/upload-artifact@v4
        with:
          name: Universe-Admin-Update-Suite-win-x64
          path: Universe-Admin-Update-Suite-win-x64.zip

      - name: Commit Admin GUI and updater executables
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UniverseAdminTerminal.exe UniverseUpdater.exe
          if (git diff --cached --quiet) {
            Write-Host "No executable changes to commit."
            exit 0
          }
          git commit -m "build: publish Admin Systems GUI and updater Windows executables"
          git push origin HEAD:main
