name: Build Universe Server and Client EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/UniverseServerLauncher/**"
      - "tools/UniverseClientLauncher/**"
      - "server/**"
      - "src/**"
      - "shared/**"
      - "start-server.bat"
      - "package.json"
      - "tsconfig.server.json"
      - ".github/workflows/build-universe-exes.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript server build
        run: npm run server:build
      - name: Validate generated server JavaScript
        shell: pwsh
        run: |
          $files = Get-ChildItem "dist-server" -Filter "*.js" -Recurse -File
          if ($files.Count -eq 0) { throw "No generated server JavaScript files found." }
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax error: $($file.FullName)" }
          }
      - name: Verify generated server entrypoint
        shell: pwsh
        run: |
          $index = Get-Content "dist-server/index.js" -Raw
          if ($index -match '^\s*\[\*\] Compiling') { throw "dist-server/index.js contains compiler output." }
          Write-Host "Generated server entrypoint passed validation."
      - name: Frontend build
        run: npm run build
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Server EXE
        run: dotnet publish tools/UniverseServerLauncher/UniverseServerLauncher.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true
      - name: Build Client EXE
        run: dotnet publish tools/UniverseClientLauncher/UniverseClientLauncher.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true
      - name: Validate EXEs
        shell: pwsh
        run: |
          $files = @(
            "tools/UniverseServerLauncher/bin/Release/net8.0-windows/win-x64/publish/UniverseServer.exe",
            "tools/UniverseClientLauncher/bin/Release/net8.0-windows/win-x64/publish/UniverseClient.exe"
          )
          foreach ($path in $files) {
            $f = Get-Item $path
            if ($f.Length -lt 1000000) { throw "$path is too small." }
            $b = [IO.File]::ReadAllBytes($path)
            if ($b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw "$path is not a PE executable." }
            Write-Host "$path = $($f.Length) bytes"
          }
      - name: Package EXEs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/UniverseServer,release/UniverseClient | Out-Null
          Copy-Item "tools/UniverseServerLauncher/bin/Release/net8.0-windows/win-x64/publish/UniverseServer.exe" "release/UniverseServer/UniverseServer.exe"
          Copy-Item "tools/UniverseClientLauncher/bin/Release/net8.0-windows/win-x64/publish/UniverseClient.exe" "release/UniverseClient/UniverseClient.exe"
          Copy-Item start-server.bat release/UniverseServer/
          Copy-Item package.json release/UniverseClient/
          Compress-Archive -Path release/UniverseServer/* -DestinationPath release/UniverseServer-win-x64.zip -Force
          Compress-Archive -Path release/UniverseClient/* -DestinationPath release/UniverseClient-win-x64.zip -Force
      - name: Upload Server package
        uses: actions/upload-artifact@v4
        with:
          name: UniverseServer-win-x64
          path: release/UniverseServer-win-x64.zip
      - name: Upload Client package
        uses: actions/upload-artifact@v4
        with:
          name: UniverseClient-win-x64
          path: release/UniverseClient-win-x64.zip
