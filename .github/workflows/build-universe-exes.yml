name: Build Universe Server and Client EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/UniverseServerLauncher/**"
      - "tools/UniverseClientLauncher/**"
      - "start-server.bat"
      - "package.json"
      - ".github/workflows/build-universe-exes.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Universe Server EXE
        run: dotnet publish tools/UniverseServerLauncher/UniverseServerLauncher.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Build Universe Client EXE
        run: dotnet publish tools/UniverseClientLauncher/UniverseClientLauncher.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Assemble portable runtime package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/UniverseServer,release/UniverseClient | Out-Null
          Copy-Item start-server.bat release/UniverseServer/
          Copy-Item package.json release/UniverseClient/
          Copy-Item package-lock.json release/UniverseClient/ -ErrorAction SilentlyContinue
          Copy-Item tools/UniverseServerLauncher/bin/Release/net8.0-windows/win-x64/publish/UniverseServer.exe release/UniverseServer/
          Copy-Item tools/UniverseClientLauncher/bin/Release/net8.0-windows/win-x64/publish/UniverseClient.exe release/UniverseClient/
          Compress-Archive -Path release/UniverseServer/* -DestinationPath release/UniverseServer-win-x64.zip -Force
          Compress-Archive -Path release/UniverseClient/* -DestinationPath release/UniverseClient-win-x64.zip -Force

      - name: Upload Universe Server EXE
        uses: actions/upload-artifact@v4
        with:
          name: UniverseServer-win-x64
          path: release/UniverseServer-win-x64.zip

      - name: Upload Universe Client EXE
        uses: actions/upload-artifact@v4
        with:
          name: UniverseClient-win-x64
          path: release/UniverseClient-win-x64.zip
