name: Build Universe Server and Client EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/UniverseServerLauncher/**"
      - "tools/UniverseClientLauncher/**"
      - "server/**"
      - "src/**"
      - "shared/**"
      - "start-server.bat"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.server.json"
      - ".github/workflows/build-universe-exes.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript server build
        run: npm run server:build

      - name: Validate generated server JavaScript
        shell: pwsh
        run: |
          if (-not (Test-Path "dist-server/index.js")) { throw "dist-server/index.js was not generated." }
          node --check "dist-server/index.js"
          Write-Host "Server JavaScript syntax check passed."

      - name: Frontend build
        run: npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Universe Server EXE
        run: dotnet publish tools/UniverseServerLauncher/UniverseServerLauncher.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Build Universe Client EXE
        run: dotnet publish tools/UniverseClientLauncher/UniverseClientLauncher.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Validate native PE binaries
        shell: pwsh
        run: |
          $files = @(
            "tools/UniverseServerLauncher/bin/Release/net8.0-windows/win-x64/publish/UniverseServer.exe",
            "tools/UniverseClientLauncher/bin/Release/net8.0-windows/win-x64/publish/UniverseClient.exe"
          )
          foreach ($path in $files) {
            $file = Get-Item $path
            if ($file.Length -lt 1000000) { throw "$path is unexpectedly small: $($file.Length) bytes" }
            $bytes = [IO.File]::ReadAllBytes($path)
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "$path is not an MZ/PE executable" }
            Write-Host "$path : $($file.Length) bytes"
          }

      - name: Smoke test Server EXE
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $exe = (Resolve-Path "tools/UniverseServerLauncher/bin/Release/net8.0-windows/win-x64/publish/UniverseServer.exe").Path
          Copy-Item $exe "$root/UniverseServer-test.exe" -Force
          $p = Start-Process "$root/UniverseServer-test.exe" -WorkingDirectory $root -PassThru
          Start-Sleep -Seconds 4
          if ($p.HasExited) {
            if ($p.ExitCode -ne 0) { throw "UniverseServer.exe exited with code $($p.ExitCode)" }
            Write-Host "UniverseServer.exe exited cleanly during smoke test."
          } else {
            Stop-Process -Id $p.Id -Force
            Write-Host "UniverseServer.exe launched successfully."
          }
          Remove-Item "$root/UniverseServer-test.exe" -Force -ErrorAction SilentlyContinue

      - name: Smoke test Client EXE
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $exe = (Resolve-Path "tools/UniverseClientLauncher/bin/Release/net8.0-windows/win-x64/publish/UniverseClient.exe").Path
          Copy-Item $exe "$root/UniverseClient-test.exe" -Force
          $p = Start-Process "$root/UniverseClient-test.exe" -WorkingDirectory $root -PassThru
          Start-Sleep -Seconds 4
          if ($p.HasExited) {
            if ($p.ExitCode -ne 0) { throw "UniverseClient.exe exited with code $($p.ExitCode)" }
            Write-Host "UniverseClient.exe exited cleanly during smoke test."
          } else {
            Stop-Process -Id $p.Id -Force
            Write-Host "UniverseClient.exe launched successfully."
          }
          Remove-Item "$root/UniverseClient-test.exe" -Force -ErrorAction SilentlyContinue

      - name: Assemble runtime packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/UniverseServer,release/UniverseClient | Out-Null
          Copy-Item "tools/UniverseServerLauncher/bin/Release/net8.0-windows/win-x64/publish/UniverseServer.exe" "release/UniverseServer/UniverseServer.exe"
          Copy-Item "tools/UniverseClientLauncher/bin/Release/net8.0-windows/win-x64/publish/UniverseClient.exe" "release/UniverseClient/UniverseClient.exe"
          Copy-Item start-server.bat release/UniverseServer/
          Copy-Item package.json release/UniverseClient/
          Copy-Item package-lock.json release/UniverseClient/ -ErrorAction SilentlyContinue
          Compress-Archive -Path release/UniverseServer/* -DestinationPath release/UniverseServer-win-x64.zip -Force
          Compress-Archive -Path release/UniverseClient/* -DestinationPath release/UniverseClient-win-x64.zip -Force

      - name: Upload Universe Server package
        uses: actions/upload-artifact@v4
        with:
          name: UniverseServer-win-x64
          path: release/UniverseServer-win-x64.zip

      - name: Upload Universe Client package
        uses: actions/upload-artifact@v4
        with:
          name: UniverseClient-win-x64
          path: release/UniverseClient-win-x64.zip
