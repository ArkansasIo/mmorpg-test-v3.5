name: Full Build and Validation

on:
  push:
    branches: ["main", "**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Frontend TypeScript check
        run: npm run lint
      - name: Server TypeScript check
        run: npm run server:build
      - name: Validate generated server JavaScript
        shell: bash
        run: |
          test -f dist-server/index.js
          while IFS= read -r -d "" file; do node --check "$file"; done < <(find dist-server -type f -name "*.js" -print0)
      - name: Frontend production build
        run: npm run build
      - name: Validate frontend production output
        shell: bash
        run: |
          test -f dist/index.html
          grep -q "/assets/" dist/index.html
      - name: Dependency smoke test
        run: npm run test:dependency
